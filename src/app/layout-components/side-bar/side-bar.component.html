<div class="d-none d-lg-block side-bar border-end border-secondary">



    <aside class="px-3 pt-4">

        <ng-container *ngFor="let s of section.linkButtons">

            <div 
            #sectionBtn
            id="{{s.link}}"
            class="item px-3 py-2 rounded-2 lh-1 cursor-pointer my-2"
            routerLink="/{{s.link}}" 
            (click)="selectSection($event)">
                <i class="bi me-2" [class]="s.bsClass"></i>{{s.btn}}
            </div>

        </ng-container>
